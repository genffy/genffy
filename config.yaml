baseURL: "https://genffy.com" # if your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
title: "进击的页面仔 | genffy"
pagination:
  perPage: 10
  archive:
    yearly: true
    monthly: true
    daily: true
    
theme: PaperMod
defaultContentLanguage: zh
resourceDir: ../resources

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
# googleAnalytics: UA-123-45
copyright: "&copy; 2026 <a href=\"https://genffy.com\">进击的页面仔</a>"
taxonomies:
  category: categories
  tag: tags
  series: series
# permalinks:
#   posts: /:year/:month/:title/

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "EN"
    weight: 1
    title: genffy
    contentDir: "content/en"
    params:
      description: "genffy's personal site: embodied AI, crypto and development. A weekly embodied-AI digest (in Chinese) every Friday."
      profileMode:
        enabled: true
        title: genffy
        subtitle: "Embodied AI · Crypto · Dev"
        imageUrl: "/images/genffy.jpeg"
        imageTitle: genffy
        buttons:
          - name: Archives
            url: archives
          - name: Tags
            url: tags
    menu:
      main:
        - identifier: posts
          name: Posts
          url: posts
          weight: 5
        - identifier: share
          name: Share
          url: https://share.genffy.com/
          weight: 10
        - identifier: about
          name: About
          url: about
  zh:
    weight: 3
    title: 进击的页面仔
    languageName: "ZH"
    contentDir: "content/zh"
    params:
      description: "进击的页面仔（genffy）的个人站：具身智能、Crypto 与开发。每周五更新《页面仔的具身智能周报》。"
      profileMode:
        enabled: true
        title: 进击的页面仔
        subtitle: "具身智能 · Crypto · 开发"
        imageUrl: "/images/genffy.jpeg"
        imageTitle: genffy
        buttons:
          - name: 归档
            url: archives
          - name: 标签
            url: tags
    menu:
      main:
        - identifier: posts
          name: 文章
          url: posts
          weight: 5
        - identifier: share
          name: 分享
          url: https://share.genffy.com/
          weight: 10
        - identifier: about
          name: 关于
          url: about

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "进击的页面仔 / genffy - 具身智能 · Crypto · 开发"
  author: genffy
  # site-wide fallback for og:image / twitter:image (also switches twitter:card to summary_large_image)
  images: ["/brand/og-default.jpg"]
  social:
    twitter: genffy
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  comments: true
  # images: ["papermod-cover.png"]

  homeInfoParams:
    enabled: false
    Title: genffy
    Content: >
      # TODO

  socialIcons:
    - name: github
      url: "https://github.com/genffy"
    - name: x
      url: "https://x.com/genffy"
    # Xiaohongshu: the theme has no icon for it, so the entry carries its own svg (Tabler "notebook", MIT)
    - name: xiaohongshu
      title: 小红书
      url: "https://xhslink.cn/o/8gsjxZ2Ewbd"
      svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-11a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1m3 0v18" /><path d="M13 8l2 0" /><path d="M13 12l2 0" /></svg>'
    - name: Rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/genffy/genffy/tree/main"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # header logo: the avatar photo (whole frame, resized) in front of the site title
  label:
    icon: "/brand/icon-112.png"
    iconHeight: 28

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    # disableHLJS: false
    # all derived from static/images/genffy.jpeg (whole frame, only resized) by the genffy brand kit, which is kept outside this repo
    # (previously /images/genffy.png, which never existed -> 404)
    favicon: "/brand/favicon.ico"
    favicon16x16: "/brand/favicon-16.png"
    favicon32x32: "/brand/favicon-32.png"
    apple_touch_icon: "/brand/apple-touch-icon.png"
    safari_pinned_tab: "/brand/icon-192.png" # legacy hook; a PNG is ignored by Safari but avoids a 404
    theme_color: "#F6F1E7"
    msapplication_TileColor: "#1B1917"

  # cover:
  #     hidden: true # hide everywhere but not in structured data
  #     hiddenInList: true # hide on list pages and home
  #     hiddenInSingle: true # hide on single page

  # fuseOpts:
  #     isCaseSensitive: false
  #     shouldSort: true
  #     location: 0
  #     distance: 1000
  #     threshold: 0.4
  #     minMatchCharLength: 0
  #     keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

privacy:
  vimeo:
    disabled: false
    simple: true

  x:
    disabled: false
    enableDNT: true
    simple: true

  instagram:
    disabled: false
    simple: true

  youtube:
    disabled: false
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
